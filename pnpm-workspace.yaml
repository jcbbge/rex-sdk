catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.0"
  - "@effect/platform-node@4.1.0"
  - effect@4.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@google/genai":
    build: false
  esbuild:
    build: false
  protobufjs:
    build: false
  traits:
    skills: true
skills:
  dirs:
    - .agents/skills
# Build scripts of transitive dev dependencies that nothing here needs; deny them explicitly so
# installs in CI don't fail on unapproved builds.
allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false
